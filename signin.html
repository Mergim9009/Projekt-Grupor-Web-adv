<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitlife - Sign In</title>
  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@600;700;800;900&family=Rubik:wght@400;500;800&display=swap" rel="stylesheet">
</head>
<body id="top" data-force-header="true">

  <header class="header" data-header>
    <div class="container">

      <a href="index.html" class="logo">
        <ion-icon name="barbell-sharp" aria-hidden="true"></ion-icon>
        <span class="span">Fitlife</span>
      </a>

      <nav class="navbar" data-navbar>
        <button class="nav-close-btn" aria-label="close menu" data-nav-toggler>
          <ion-icon name="close-sharp" aria-hidden="true"></ion-icon>
        </button>
        <ul class="navbar-list">
          <li><a href="index.html#home" class="navbar-link" data-nav-link>Home</a></li>
          <li><a href="index.html#about" class="navbar-link" data-nav-link>About Us</a></li>
          <li><a href="classes.html" class="navbar-link" data-nav-link>Classes</a></li>
          <li><a href="index.html#blog" class="navbar-link" data-nav-link>Blog</a></li>
          <li><a href="contact.html" class="navbar-link" data-nav-link>Contact Us</a></li>
          <li><a href="workout.html" class="navbar-link" data-nav-link>Workout Maker</a></li>
        </ul>
      </nav>

      <a href="signup.html" class="btn btn-secondary">Join Now</a>

      <button class="nav-open-btn" aria-label="open menu" data-nav-toggler>
        <span class="line"></span>
        <span class="line"></span>
        <span class="line"></span>
      </button>
    </div>
  </header>

  <main>
    <article>
      <section class="section bg-dark has-bg-image" aria-label="sign in" style="background-image: url('./assets/images/footer-bg.png'); padding-block-start: calc(var(--section-padding) + 140px);">
        <div class="container" style="max-width: 680px;">
          <p class="section-subtitle" style="text-align:center;">Welcome back</p>
          <h1 class="h2 section-title text-center">Sign In</h1>
          <p class="section-text" style="text-align:center; max-width: 600px; margin: 0 auto 24px;">Access your account to track classes and plans.</p>

          <form id="signin-form" class="workout-form" style="margin: 0 auto;">
            <div class="form-grid" style="grid-template-columns: 1fr; gap: 14px;">
              <div class="form-field">
                <label for="email" class="h3">Email</label>
                <input type="email" id="email" required class="input-field" placeholder="you@example.com">
              </div>
              <div class="form-field">
                <label for="password" class="h3">Password</label>
                <input type="password" id="password" required class="input-field" placeholder="••••••••">
              </div>
            </div>
            <div class="actions" style="margin-top: 20px; display: flex; gap: 12px; align-items:center;">
              <button type="submit" class="btn btn-primary">Sign In</button>
              <a class="btn btn-secondary" href="signup.html">Create account</a>
            </div>
          </form>
        </div>
      </section>
    </article>
  </main>

  <footer class="footer">
    <div class="section footer-top bg-dark has-bg-image" style="background-image: url('./assets/images/footer-bg.png')">
      <div class="container">
        <div class="footer-brand">
          <a href="#" class="logo">
            <ion-icon name="barbell-sharp" aria-hidden="true"></ion-icon>
            <span class="span">Fitlife</span>
          </a>
          <p class="footer-brand-text">Sign in to sync your goals and progress.</p>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <div class="container">
        <p class="copyright">
          &copy; 2025 dalmat. All rights reserved.
        </p>
      </div>
    </div>
  </footer>

  <a href="#top" class="back-top-btn" aria-label="back to top" data-back-top-btn>
    <ion-icon name="caret-up-sharp" aria-hidden="true"></ion-icon>
  </a>

  <script src="./assets/js/script.js" defer></script>
  <script src="./assets/js/auth.js" defer></script>
  <script>
    (function(){
      const form = document.getElementById('signin-form');
      if(!form) return;
      form.addEventListener('submit', function(e){
        e.preventDefault();
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        if(!email.value || !password.value) return;
        localStorage.setItem('fitlife_user', JSON.stringify({ email: email.value, ts: Date.now() }));
        window.location.href = 'index.html';
      });
    })();
  </script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
