<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Power Gym</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="Get in touch with Power Gym — ask about memberships, classes, or personal training.">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="index.html">Power<span>Gym</span></a>
            <button class="nav-toggle" aria-controls="main-nav" aria-expanded="false">☰</button>
            <nav id="main-nav" class="main-nav">
                <ul>
                    <li><a href="index.html#home">Home</a></li>
                    <li><a href="index.html#classes">Classes</a></li>
                    <li><a href="index.html#trainers">Trainers</a></li>
                    <li><a href="index.html#plans">Plans</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contact-page">
        <section class="contact container">
            <h1 class="section-title">Contact Us</h1>
            <p class="contact-intro">Have questions or want to start your fitness journey? Send us a message below — we’ll reply shortly.</p>

            <form id="contactForm" class="contact-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>
                </div>

                <button type="submit" class="btn primary">Send Message</button>
                <p id="formMessage" class="form-message"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; <span id="year"></span> Power Gym — All rights reserved.</p>
            <div class="social">
                <a href="#" aria-label="Instagram">IG</a>
                <a href="#" aria-label="Facebook">FB</a>
            </div>
        </div>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
